<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        html, body { height: 100%; margin: 0; background: #1e1e1e; overflow: hidden; }
        #terminal { height: 100%; width: 100%; }

        /* The scrollback is scrolled with the wheel and with Shift+PageUp, so the bar itself is
           only in the way - and being the browser's own, it is drawn in the browser's light grey
           down the edge of a dark terminal. */
        .xterm-viewport { scrollbar-width: none; }
        .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script>
        // Bridge between xterm.js and the hosting protocol class.
        //
        // host -> page : { type: 'output', data: <base64 of the raw bytes from the server> }
        //                { type: 'status', text: <message to show in the terminal> }
        // page -> host : { type: 'input',  data: <the text the user typed> }
        //                { type: 'resize', cols: n, rows: n }
        //                { type: 'copy',   data: <the text just selected> }
        //                { type: 'paste' }  - the host reads the clipboard itself
        //                { type: 'active' } - clicked or typed in, so menus elsewhere can close
        //                { type: 'ready' }
        //
        // Server output travels as base64 rather than text: it is a byte stream that can be cut
        // in the middle of a UTF-8 sequence, and xterm.js reassembles those itself when it is
        // handed a Uint8Array.

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'Consolas, "Cascadia Mono", monospace',
            fontSize: 14,
            scrollback: 10000,
            theme: { background: '#1e1e1e', foreground: '#e8ebee' }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));

        const host = window.chrome.webview;

        function send(message) { host.postMessage(JSON.stringify(message)); }

        function fitAndReport() {
            try {
                fitAddon.fit();
                send({ type: 'resize', cols: term.cols, rows: term.rows });
            } catch (e) {
                // the page can be laid out before it has a size, nothing to report yet
            }
        }

        term.onData(data => send({ type: 'input', data: data }));

        // A menu opened elsewhere in the application does not notice a click or a keystroke that
        // lands in here: this page runs in the browser process, so its input never passes through
        // the message loop the menus watch. Saying so is the only way they can find out.
        term.element.addEventListener('pointerdown', () => send({ type: 'active' }));

        // PuTTY's two mouse habits, which is what people actually reach for in a terminal: a
        // right click pastes outright, and a selection is on the clipboard the moment it is
        // made. The clipboard itself is left to the host - there it needs no browser permission,
        // and the pasted text never has to travel through this page at all.
        term.element.addEventListener('contextmenu', e => {
            e.preventDefault();
            send({ type: 'paste' });
        });

        // Not on mouseup: xterm has not settled the selection by then, so what came back was the
        // one before it - copying appeared to work only on the second try. onSelectionChange fires
        // when the selection is final, and the wait swallows the storm of them during a drag.
        let selectionTimer = null;
        term.onSelectionChange(() => {
            clearTimeout(selectionTimer);
            selectionTimer = setTimeout(() => {
                const selection = term.getSelection();
                if (selection) send({ type: 'copy', data: selection });
            }, 60);
        });

        // Font size: the PuTTY session sets the base size, and this remembers an adjustment on
        // top of it. Kept in localStorage rather than in the connection file - the page is always
        // served from the same virtual host, so the value survives restarts, and the size is a
        // property of this screen rather than of any one server.
        let baseFontSize = term.options.fontSize;

        function fontSizeDelta() {
            return parseInt(localStorage.getItem('fontSizeDelta') || '0', 10);
        }

        function applyFontSize() {
            const size = Math.min(72, Math.max(6, baseFontSize + fontSizeDelta()));
            term.options.fontSize = size;
            fitAndReport();
        }

        function zoom(step) {
            localStorage.setItem('fontSizeDelta', step === 0 ? 0 : fontSizeDelta() + step);
            applyFontSize();
        }

        // Applied now, not only when an appearance message arrives. A connection that names no
        // PuTTY session and has no terminal options set gets no such message at all, so the
        // remembered adjustment was never put on - the terminal opened at the default size, and
        // the first Ctrl++ jumped it to the remembered size plus one, which looked like the
        // setting had not been kept.
        applyFontSize();

        // Return false to keep the key away from the session.
        term.attachCustomKeyEventHandler(e => {
            if (e.type !== 'keydown') return true;

            if (!e.ctrlKey) return true;

            if (e.key === '+' || e.key === '=') { zoom(1); return false; }
            if (e.key === '-') { zoom(-1); return false; }
            if (e.key === '0') { zoom(0); return false; }

            // Switching sessions has to work from inside a session - that is the only place it is
            // any use. The menu never gets these: the page has the keyboard, and the WinForms
            // WebView2 control exposes no way for the host to see an accelerator first. Caught
            // here and handed over instead.
            if (e.key === 'PageDown') { send({ type: 'session', move: 'next' }); return false; }
            if (e.key === 'PageUp') { send({ type: 'session', move: 'previous' }); return false; }

            // Ctrl+1..9 as well. Ctrl+0 is taken above, for resetting the zoom.
            if (e.key >= '1' && e.key <= '9') {
                send({ type: 'session', move: 'index', index: Number(e.key) });
                return false;
            }

            return true;
        });

        // F11 belongs to the window, not to the shell. Left alone it is delivered to the
        // terminal, which writes its escape sequence into the session.
        //
        // On the document rather than through xterm's key handler, because that one only runs for
        // keys that reach the terminal's own input. Entering fullscreen rebuilds the layout around
        // this control, and afterwards the focus sits inside the page but outside the terminal -
        // so F11 got in but never back out. The document sees it either way.
        document.addEventListener('keydown', e => {
            if (e.key !== 'F11') return;

            e.preventDefault();
            e.stopPropagation();
            send({ type: 'fullscreen' });
        }, true);

        term.element.addEventListener('wheel', e => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            zoom(e.deltaY < 0 ? 1 : -1);
        }, { passive: false });

        host.addEventListener('message', event => {
            const message = JSON.parse(event.data);

            if (message.type === 'focus') {
                term.focus();
            } else if (message.type === 'appearance') {
                // Font and colours of the PuTTY session the connection names, so the same
                // connection looks the same whichever terminal opens it.
                if (message.fontFamily) term.options.fontFamily = `"${message.fontFamily}", Consolas, monospace`;
                if (message.bold) term.options.fontWeight = 'bold';
                if (message.scrollback) term.options.scrollback = message.scrollback;
                if (message.theme) term.options.theme = message.theme;

                // The session gives the base size; the remembered zoom is applied on top of it.
                if (message.fontSize) baseFontSize = message.fontSize;
                applyFontSize();
            } else if (message.type === 'output') {
                const binary = atob(message.data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                term.write(bytes);
            } else if (message.type === 'status') {
                term.writeln(message.text);
            }
        });

        // Watches the terminal's own box rather than the window, because the two do not always
        // change together: a tab dragged out into a window of its own, or that window resized,
        // gave the page a new size without a window resize event to go with it - so the terminal
        // kept the row count it had in the tab and left the rest of the window empty.
        let resizeTimer = null;
        function refitSoon() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitAndReport, 100);
        }

        new ResizeObserver(refitSoon).observe(document.getElementById('terminal'));
        window.addEventListener('resize', refitSoon);

        // Temporary marker: PuTTY and this terminal are being compared side by side and look
        // alike, so say which one this is. Remove once PuTTY is no longer in the picture.
        term.writeln('\x1b[2m-- mRemoteNG native SSH (xterm.js + SSH.NET) --\x1b[0m');

        fitAndReport();
        term.focus();
        send({ type: 'ready' });
    </script>
</body>
</html>
