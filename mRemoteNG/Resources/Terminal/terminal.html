<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        html, body { height: 100%; margin: 0; background: #1e1e1e; overflow: hidden; }
        #terminal { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script>
        // Bridge between xterm.js and the hosting protocol class.
        //
        // host -> page : { type: 'output', data: <base64 of the raw bytes from the server> }
        //                { type: 'status', text: <message to show in the terminal> }
        // page -> host : { type: 'input',  data: <the text the user typed> }
        //                { type: 'resize', cols: n, rows: n }
        //                { type: 'ready' }
        //
        // Server output travels as base64 rather than text: it is a byte stream that can be cut
        // in the middle of a UTF-8 sequence, and xterm.js reassembles those itself when it is
        // handed a Uint8Array.

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'Consolas, "Cascadia Mono", monospace',
            fontSize: 14,
            scrollback: 10000,
            theme: { background: '#1e1e1e', foreground: '#e8ebee' }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));

        const host = window.chrome.webview;

        function send(message) { host.postMessage(JSON.stringify(message)); }

        function fitAndReport() {
            try {
                fitAddon.fit();
                send({ type: 'resize', cols: term.cols, rows: term.rows });
            } catch (e) {
                // the page can be laid out before it has a size, nothing to report yet
            }
        }

        term.onData(data => send({ type: 'input', data: data }));

        // A menu opened elsewhere in the application does not notice a click or a keystroke that
        // lands in here: this page runs in the browser process, so its input never passes through
        // the message loop the menus watch. Saying so is the only way they can find out.
        term.element.addEventListener('pointerdown', () => send({ type: 'active' }));

        // Font size: the PuTTY session sets the base size, and this remembers an adjustment on
        // top of it. Kept in localStorage rather than in the connection file - the page is always
        // served from the same virtual host, so the value survives restarts, and the size is a
        // property of this screen rather than of any one server.
        let baseFontSize = term.options.fontSize;

        function fontSizeDelta() {
            return parseInt(localStorage.getItem('fontSizeDelta') || '0', 10);
        }

        function applyFontSize() {
            const size = Math.min(72, Math.max(6, baseFontSize + fontSizeDelta()));
            term.options.fontSize = size;
            fitAndReport();
        }

        function zoom(step) {
            localStorage.setItem('fontSizeDelta', step === 0 ? 0 : fontSizeDelta() + step);
            applyFontSize();
        }

        // Return false to keep the key away from the session.
        term.attachCustomKeyEventHandler(e => {
            if (!e.ctrlKey || e.type !== 'keydown') return true;

            if (e.key === '+' || e.key === '=') { zoom(1); return false; }
            if (e.key === '-') { zoom(-1); return false; }
            if (e.key === '0') { zoom(0); return false; }

            return true;
        });

        term.element.addEventListener('wheel', e => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            zoom(e.deltaY < 0 ? 1 : -1);
        }, { passive: false });

        host.addEventListener('message', event => {
            const message = JSON.parse(event.data);

            if (message.type === 'focus') {
                term.focus();
            } else if (message.type === 'appearance') {
                // Font and colours of the PuTTY session the connection names, so the same
                // connection looks the same whichever terminal opens it.
                if (message.fontFamily) term.options.fontFamily = `"${message.fontFamily}", Consolas, monospace`;
                if (message.bold) term.options.fontWeight = 'bold';
                if (message.scrollback) term.options.scrollback = message.scrollback;
                if (message.theme) term.options.theme = message.theme;

                // The session gives the base size; the remembered zoom is applied on top of it.
                if (message.fontSize) baseFontSize = message.fontSize;
                applyFontSize();
            } else if (message.type === 'output') {
                const binary = atob(message.data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                term.write(bytes);
            } else if (message.type === 'status') {
                term.writeln(message.text);
            }
        });

        // The panel drives the size, so refit whenever the window changes and once at startup.
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitAndReport, 100);
        });

        // Temporary marker: PuTTY and this terminal are being compared side by side and look
        // alike, so say which one this is. Remove once PuTTY is no longer in the picture.
        term.writeln('\x1b[2m-- mRemoteNG native SSH (xterm.js + SSH.NET) --\x1b[0m');

        fitAndReport();
        term.focus();
        send({ type: 'ready' });
    </script>
</body>
</html>
